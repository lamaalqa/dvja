name: SBOM + Scan

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  sbom-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh
          sudo install ./bin/syft /usr/local/bin/syft

      - name: Generate SBOM (Table)
        run: |
          syft dir:. -o table > sbom.txt

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          syft dir:. -o cyclonedx-json > sbom.json

      # ✅ الحل هنا: نستخدم scan-type=fs ونمرر SBOM كـ input file مباشرة
      - name: Scan SBOM with Trivy
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: 'fs'
          scan-ref: 'sbom.json'
          format: 'json'
          output: 'results.json'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-results
          path: |
            sbom.txt
            sbom.json
            results.json
